name: Sync upstream and rebuild

# Keeps this fork caught up with github.com/firecrawl/open-lovable. A merge pushed with the
# default GITHUB_TOKEN does NOT trigger other workflows (GitHub's anti-recursion rule for the
# push event), so docker-build.yml would never fire after a sync-only merge. This workflow
# therefore builds and pushes the image itself whenever the merge actually brings in new commits.

on:
  schedule:
    - cron: '17 4 * * *' # daily, off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream/main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          before="$(git rev-parse HEAD)"
          git remote add upstream https://github.com/firecrawl/open-lovable.git
          git fetch upstream main
          git merge upstream/main --no-edit -m "Merge upstream/main"
          after="$(git rev-parse HEAD)"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" != "$after" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main

      - uses: docker/setup-buildx-action@v3
        if: steps.merge.outputs.changed == 'true'

      - uses: docker/login-action@v3
        if: steps.merge.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.merge.outputs.changed == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/filipdadgar/open-lovable:main-amd64
            ghcr.io/filipdadgar/open-lovable:${{ steps.merge.outputs.after }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
